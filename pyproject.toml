[project]
name = "bazaarly-backend"
version = "0.1.0"
description = "Bazaarly multi-vendor marketplace backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "boto3>=1.34.0",
    "stripe>=9.0.0",
    "slowapi>=0.1.9",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
plugins = ["pydantic"]

[tool.alembic]
script_location = "alembic"

[tool.hatch.build.targets.wheel]
packages = ["app"]
