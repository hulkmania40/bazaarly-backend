version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: bazaarly
      POSTGRES_PASSWORD: bazaarly
      POSTGRES_DB: bazaarly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazaarly"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://bazaarly:bazaarly@postgres:5432/bazaarly
      APP_ENV: development
      DEBUG: "true"
      SECRET_KEY: change-me-in-production-use-a-real-secret-key
      FRONTEND_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app

volumes:
  pgdata:
